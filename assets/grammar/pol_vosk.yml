# Gramatyka sterowania głosowego (polski) dla silnika na Vosku.
#
# UWAGA: to jest ASSET APLIKACJI (wpisany w pubspec.yaml), czytany w czasie
# działania przez lib/helpers/vosk_grammar.dart. Nie jest to już notatka
# robocza - zmiana tego pliku zmienia zachowanie aplikacji.
# Jedno źródło prawdy: narzędzia w pliki/ też czytają WŁAŚNIE ten plik.
#
# Silnik robi z niego dwie rzeczy:
#   1. gramatykę frazową dla recognizera Vosk (ogranicza słownik z 244 431
#      słów do ~3000 fraz -> radykalnie wyższa trafność),
#   2. parser tekst -> {intent, slots} w kształcie RhinoInference, żeby switch
#      w voice_screen2.dart został bez zmian.
#
# Składnia (odziedziczona po Rhino):
#   słowo          wymagane
#   (słowo)        opcjonalne
#   (a,b)          opcjonalna alternatywa
#   [a,b]          alternatywa WYMAGANA
#   $slot:klucz    slot ze sekcji slots; zwraca KANONICZNĄ wartość stąd
#   $pv.Typ:klucz  liczebnik: Percent -> "NN%", TwoDigitInteger -> "NN",
#                  SingleDigitInteger -> "N"
#
# UWAGA: słowa "procent" NIE MA i nie może być w wyrażeniach - należy do typu
# $pv.Percent (tak samo jak w Rhino) i zjada je parser, nie wzorzec. Od
# 02.08.2026 jest OPCJONALNE - patrz "SŁOWO »PROCENT« GINIE" na końcu pliku.
#
# Po każdej zmianie warto uruchomić (w kontenerze, bez telefonu):
#   python3 pliki/vosk_gramatyka_test.py --oov     # słowa spoza słownika modelu
#   python3 pliki/vosk_parser_ref.py --test        # 100 komend z lista_komend.txt
# Historia decyzji i uzasadnienia - w komentarzach na końcu pliku.

context:
  expressions:
    # --- sterowanie sesją nasłuchu -----------------------------------------
    # Przy Vosku "hej maja" NIE jest osobnym silnikiem wake-word (Porcupine),
    # tylko zwykłą frazą tej gramatyki. voiceStart zastępuje przycisk START,
    # voiceStop wraca do czuwania. Oba intenty obsługuje voice_vosk_screen.dart
    # PRZED switchem w prettyPrintInference - do logiki pasiecznej nie trafiają.
    # W czuwaniu recognizer dostaje TYLKO te dwie frazy (setGrammar), więc
    # zwykła rozmowa nie ma jak otworzyć sesji.
    # Wszystkie słowa sprawdzone w słowniku modelu (pliki/vosk_slownik_pl.txt).
    voiceStart:
      - hej maja [start,zaczynamy,startujemy]
    voiceStop:
      - hej maja [stop,kończymy,koniec]
    # --- dyktowanie notatki -------------------------------------------------
    # Otwiera nasłuch SWOBODNY (recognizer bez gramatyki) - patrz
    # VoskEngine.zacznijDyktowanie. Notatkę kończy "hej maja", czyli to samo
    # zawołanie, które otwiera sesję: użytkownik ma pamiętać jedno, nie dwa.
    # Intent przechwytuje voice_vosk_screen.dart PO bramce pewności (inaczej niż
    # voiceStart/voiceStop, które ją omijają): pomyłkowe wejście w dyktowanie
    # zabiera mikrofon na kilkadziesiąt sekund i kończy się wpisem w bazie.
    # Wszystkie słowa sprawdzone w słowniku modelu (pliki/vosk_slownik_pl.txt).
    #
    # DWA UJŚCIA, DWA INTENTY. Nazwa komendy mówi wprost, gdzie tekst wyląduje -
    # tak samo jak przy wybieraniu ręcznym ("notatka do przeglądu" w oknie ramek
    # i Notes jako osobny ekran). Pomyłka jest tu droga: notatka przeglądu wymaga
    # wybranej pasieki i ula i dokleja się do rekordu przeglądu, a notatka do
    # notesu to samodzielny wpis w tabeli "notatki".
    #   voiceNote    -> uwagi dzisiejszego przeglądu wybranego ula
    #   voiceNotepad -> nowy wpis w Notesie (tabela "notatki")
    voiceNote:
      - zanotuj
      - hej maja zanotuj
      - zapisz notatkę
      - hej maja zapisz notatkę
      - hej maja notatka do przeglądu
    voiceNotepad:
      - hej maja notatka do notesu
    # --- cofanie ostatniego zapisu ------------------------------------------
    # Przywraca stan bazy sprzed ostatniej ZAPISUJĄCEJ komendy (patrz
    # lib/helpers/undo_helper.dart). Intent przechwytuje voice_vosk_screen.dart
    # przed switchem pasiecznym, PO bramce pewności - cofanie zmienia bazę, więc
    # niepewne rozpoznanie ma je odrzucić, tak samo jak dyktowanie notatki.
    #
    # WYMAGANY PREFIKS "hej maja" I PEŁNA FRAZA. Po "hej maja start" recognizer
    # słucha ciągle, a przy ulu toczy się rozmowa - komenda, która ZMIENIA BAZĘ,
    # nie może dać się wywołać przypadkiem. Były tu warianty krótsze ("cofnij
    # ostatni zapis", "cofnij zapis", "hej maja cofnij zapis"); usunięte
    # świadomie, bo "cofnij" i "zapis" to słowa, które padają w zwykłej rozmowie.
    # Zawołanie jest tym samym zabezpieczeniem co przy otwieraniu i zamykaniu
    # sesji, a cofanie jest na tyle rzadkie, że dłuższa wypowiedź nic nie
    # kosztuje. Zostają dwie formy, różniące się tylko ostatnim słowem - "zapis"
    # i "wpis" mówi się wymiennie, a przy wymaganym zawołaniu ta druga forma nic
    # nie osłabia.
    # Cena: jedno przekręcone słowo = brak dopasowania i trzeba powtórzyć.
    # Wszystkie słowa sprawdzone w słowniku modelu (pliki/vosk_slownik_pl.txt).
    voiceUndo:
      - hej maja cofnij ostatni zapis
      - hej maja cofnij ostatni wpis
    setApiary:
      - $state:apiaryState pasiekę (numer) $pv.TwoDigitInteger:nrXXOfApiary
    setHive:
      - $state:hiveState ul (numer) ($hundred:nrXXOfHiveH)
        ($pv.TwoDigitInteger:nrXXOfHive)
    setBody:
      - $state:bodyState korpus (numer) $pv.SingleDigitInteger:nrXOfBody
    setFrame:
      - ($state:frameState)($sizeOfFrame:sizeOfFrame) [ramka,ramkę] (numer)
        $pv.TwoDigitInteger:nrXXOfFrame (z) ($siteOfFrame:siteOfFrame)(strony,
        stron)
    setStore:
      - "[pokarm,na grób] $pv.Percent:food (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)"
      - larwy $pv.Percent:larvae (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)
      - (miód) dojrzały $pv.Percent:honeySealed (z,po)
        ($siteOfFrame:siteOfFrame) (strony,stronie,stron)
      - "[jaja,jajka] $pv.Percent:eggs (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)"
      - (ustaw) (z) $siteOfFrame:siteOfFrame [stron,strona,stronę,strony]
      - $isDone:isDone
      - $toDo:toDo
      - (czerw) trud $pv.Percent:drone (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)
      - "[usuń,wytnij] $pv.SingleDigitInteger:delQCells matecznik (i) (ów) (z,po)
        ($siteOfFrame:siteOfFrame) (strony,stronie,stron)"
      - $queen:queen [matka,królowa] (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)
      - $pv.SingleDigitInteger:queenCells matecznik (i) (ów) (z,po)
        ($siteOfFrame:siteOfFrame) (strony,stronie,stron)
      - susz $pv.Percent:waxComb (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)
      - "[węża,wosk] $pv.Percent:wax (z,po) ($siteOfFrame:siteOfFrame) (strony,stronie,stron)"
      - (czerw) kryty $pv.Percent:brood (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)
      - "[pierzcha,pyłek] $pv.Percent:pollen (z,po) ($siteOfFrame:siteOfFrame)
        (strony,stronie,stron)"
      - miód $pv.Percent:honey (z,po) ($siteOfFrame:siteOfFrame) (strony,stronie,stron)
    setHalfBody:
      - $state:halfBodyState pół korpus (numer)
        $pv.SingleDigitInteger:nrXOfHalfBody
    setAllHives:
      - $state:allHivesState wszystkie ule
    # setHivesRange to WARIANT trybu "wszystkie ule" zawężony do przedziału
    # numerów ("ustaw ule od pięć do dziesięć"). Włącza dokładnie ten sam tryb
    # (readyAllHives), tylko zapis leci do uli z zakresu - patrz voice_vosk_screen.
    # $state WYMAGANY, tak jak w setAllHives (a nie opcjonalny jak w setFrames):
    # "ule od ... do ..." bez czasownika za łatwo pada w zwykłej rozmowie przy ulu,
    # a ta komenda przestawia cel WSZYSTKICH kolejnych zapisów.
    # Słowa "ule", "od", "do" są już w gramatyce (setAllHives, setFrames).
    setHivesRange:
      - $state:hivesRangeState ule od $pv.TwoDigitInteger:nrXXOdHive do
        $pv.TwoDigitInteger:nrXXDoHive
    setFeeding:
      - zostało $pv.Percent:leftFood pokarmu
      - usuń $pv.Percent:removedFood pokarmu
      - syrop $pv.TwoDigitInteger:invertI (przecinek,kropka)
        ($pv.TwoDigitInteger:invertD) [litr,litra,litry,litrów]
      - ciasto $pv.SingleDigitInteger:candyI (przecinek,kropka)
        ($pv.TwoDigitInteger:candyD) [kilo,kilogram,kilograma,kilogramy,kilogramów]
      - syrop trzy do dwóch $pv.SingleDigitInteger:syrup3to2I (przecinek,kropka)
        ($pv.TwoDigitInteger:syrup3to2D) [litr,litra,litry,litrów]
      - syrop jeden do [jeden,jednego] $pv.SingleDigitInteger:syrup1to1I
        (przecinek,kropka) ($pv.TwoDigitInteger:syrup1to1D) [litr,litra,litry,litrów]
    setTreatment:
      - kwas ($hundred:acidH) ($pv.TwoDigitInteger:acid) [mililitrów,mili litr,mili litry,mili litra,miligramów,mili gram,mili gramy,mili grama]
      - roztocza ($hundred:varroaH) ($pv.TwoDigitInteger:varroa) [sztuk,sztuka,sztuki]
      - $state:biovar paski $pv.SingleDigitInteger:biovarBelts [sztuk,sztuka,sztuki]
      - chemia [porcja,dawka] numer $pv.SingleDigitInteger:apivarol
    setEquipment:
      - $deleted:excluderDel kratę
      - krata (na) [korpus,korpusie] (numer) $pv.SingleDigitInteger:excluder
      - podłoga (jest) $quality:bottomBoard
      - $state:beePolenTrap zbieracz pyłku
      - (ustaw) [ilość,liczba,liczbę] ramek (w) korpusie ([jest,na]) $pv.TwoDigitInteger:numberOfFrame
    setQueen:
      - "[królowa,matka] (jest) $queenQuality:queenQuality"
      - "[królowa,królowej,matka,matki] $queenMark:queenMark (numer)
        ($pv.TwoDigitInteger:queenNumber)"
      - "[królowa,matka] (jest) $queenStart:queenStart"
      - "[królowa,matka] (jest) $queenState:queenState"
      - "[królowa,matka] [(jest) z roku,(jest) roku,rocznik] $pv.TwoDigitInteger:queenBorn"
    setHelp:
      - $help:help
      - $helpMe:helpMe pomóż mi
    setDate:
      - ustaw inny dzień $pv.TwoDigitInteger:dateDay
      - ustaw inny miesiąc $pv.TwoDigitInteger:dateMonth
      - ustaw inny rok $pv.TwoDigitInteger:dateYear
      - ustaw $date:currentDate datę
    setColony:
      - "[martwe pszczoły,martwych pszczół] ($hundred:deadBeeHML) ($pv.TwoDigitInteger:deadBeeML)
        (mililitrów)"
      - rodzina (jest) $colonyForce:colonyForce
      - rodzina (jest) $colonyState:colonyState
    setHarvest:
      - zbiór pyłku ($hundred:beePollenHarvestHML)
        ($pv.TwoDigitInteger:beePollenHarvestML) (mililitrów)
      - zbiór pyłku $pv.SingleDigitInteger:beePollenHarvestI (przecinek,kropka)
        ($pv.TwoDigitInteger:beePollenHarvestD) [litr,litra,litry,litrów]
      - zbiór pyłku $pv.TwoDigitInteger:beePollenHarvest (raz,razy)[miarka,porcja]
      - "[zbiór miodu,miodu branie] $pv.TwoDigitInteger:honeySmallHarvest
        (raz,razy)[mała ramka,małych ramek]"
      - "[zbiór miodu,miodu branie] $pv.TwoDigitInteger:honeyBigHarvest (raz,razy)
        [duża ramka,dużych ramek]"
    setFrames:
      - ($state:framesState) [ramkę,ramki] od $pv.TwoDigitInteger:nrXXOdFrame do
        $pv.TwoDigitInteger:nrXXDoFrame
    setChange:
      - ramka (numer) $pv.TwoDigitInteger:nrXXOfFrame po przeglądzie
        (numer) $pv.TwoDigitInteger:nrXXOfFramePo
    setMoveBody:
      - przenieś (do) ([ul,ula]) (numer) ($pv.TwoDigitInteger:nrTempHive) [pół korpus,pół korpusu]
        (numer) $pv.SingleDigitInteger:nrTempHalfBody ramka (numer)
        $pv.TwoDigitInteger:nrTempFrame
      - przenieś (do) (ul) (numer) ($pv.TwoDigitInteger:nrTempHive) [korpus,korpusu] (numer)
        $pv.SingleDigitInteger:nrTempBody ramka (numer)
        $pv.TwoDigitInteger:nrTempFrame
  slots:
    state:
      # "załóż" i "zabierz" USUNIĘTE 06.08.2026 - nigdy nie były używane, a slot
      # $state wchodzi do OŚMIU wyrażeń, więc każda wartość mnoży się przez nie
      # w gramatyce frazowej. Uwaga: "zabierz" ZOSTAJE w slocie `deleted`
      # ("zabierz kratę") - to osobna lista i osobna komenda.
      - wstaw
      - usuń
      - załącz
      - wyłącz
      - otwórz
      - zamknij
      - ustaw
    siteOfFrame:
      - obu
      - prawej
      - lewej
      - prawa
      - lewa
      - prawą
      - lewą
      - obie
    toDo:
      - można izolować
      - trzeba usunąć
      - trzeba wirować
      - ramka pracy
    isDone:
      - izolacja
      - wstaw ramkę
      - usuń ramkę
      - przesuń w prawo
      - przesuń w lewo
    sizeOfFrame:
      - mała
      - duża
      - małą
      - dużą
    queen:
      - biała
      - niebieska
      - zielona
      - czerwona
      - żółta
      - czarna
      - inna
    quality:
      - ok
      - okej
      - brudna
      - czysta
      - wyczyszczona
    queenState:
      - dziewicza
      - sztuczna
      - naturalna
    queenStart:
      - wolna
      - zamknięta
      - w klatce
    queenMark:
      - ma niebieski znak
      - ma zielony znak
      - ma czerwony znak
      - ma żółty znak
      - ma biały znak
      - ma inny znak
      - brak
      - nie ma
      - nie ma znaku
    queenQuality:
      - do wymiany
      - stara
      - ok
      - okej
      - duża
      - mała
      - słaba
      - bardzo dobra
      - dobra
    helpMe:
      - ul po
      - ul przed
      - lokacja
      - ul wcześniej
      - ul później
      - ul
      - zbiory
      - rodzina
      - data
      - leczenie
      - dokarmianie
      - matka
      - wyposażenie
      - przegląd
    date:
      - aktualną
      - aktualna
    colonyForce:
      - normalna
      - bardzo słaba
      - słaba
      - bardzo silna
      - silna
    colonyState:
      - w nastroju do ucieczki
      - ok
      - okej
      - zawiązała kłąb
      - agresywna
      - łagodna
      - nie żyje
    help:
      - zamknij pomoc
      - pomóż mi
    hundred:
      - dziewięćset
      - osiemset
      - siedemset
      - sześćset
      - pięćset
      - czterysta
      - trzysta
      - dwieście
      - sto
    deleted:
      - zabierz
      - usuń
  macros: {}


# Zmiany 31.07.2026:
# setApiary: słowo pasieka zamieniłem na pasiekę - poprawniej gramatycznie i jest w słowniku
# setFrame: słowo ramka zamieniłem na ramkę - poprawniej gramatycznie i jest w słowniku
# setStore: słowo larwa zamieniłem na larwy - poprawniej gramatycznie i jest w słowniku, dodałem słowo" stron" bo brakowało
# przy ustawianiu strony ramki dopisałem "stron" dla komendy: ustaw z obu stron
# isDone: zmieniłem ramka na ramkę dla "wstaw ramkę" i "usuń ramkę"
# dopisałem trud jako alternatywę dla trut - nie wiem czy potrzebnie
# do "matecznik" dodałem liczbę mnogą: matecznik (i) (ów) - bo nie ma "mateczników"
# ponieważ nie ma w słowniku "węza" spróbujmy dopuscic zbliżone słowo "węża" - może to załatwi sprawę... jeżeli nie zostaje "wosk"
# zammiast "pierzga" spróbujmy "pierzcha"  - jak nie da rady zostaje "pyłek"
# w zostało / usuń X procent pokarm zmieniłem pokarm na pokarmu - bardziej poprawnie
# dla komend "syrop" i "ciasto" - wszystkie odmiany słowa litr i kilogram
# dla komendy "kwas" X mililitr zmieniłem na [mililitrów,mili gram,mili gramy,mili grama]
# dla komendy "roztocza dodałem sztuka,sztuki
# zamiast "o war $state:biovar $pv.SingleDigitInteger:biovarBelts [pasek,paski]" zmiana na "paski $state:biovar $pv.SingleDigitInteger:biovarBelts [sztuk,sztuka,sztuki]"
# dla komendy "krata" dołożyłem "korpusie"
# dla komendy "podłoga" dołożyłem do "quality" wyczyszczona
# zamiast zbieracz pyłek jest zbieracz pyłku - poprawnie gramatycznie
# zamiast "ramka na korpus" jest teraz "ramek w korpusie" z dodatkowymi słowami poprawiającymi gramatyke - nie wiem czy przesadziłem
# $queenQuality dopisałem "do wymiany" bo to typowy zwrot
# $queenQuality: usunąłem "zła" - w liście wyboru jakości matki ta opcja została
#   zastąpiona przez "do wymiany", więc głos nie ma czego zapisywać pod tym słowem
#   (stare wpisy z wartością "zła" nadal czytamy i dalej dają kciuk w dół)
# queenMark: było "nie ma znak" jest "nie ma znaku"
# queenState: zamiast "dziewica" jest "dziewicza" - chyba lepiej brzmi
# oprócz "matka jest z roku" dodałem "matka rocznik" XX
# date: było "prawdziwą data" zmieniłem na "aktualną datę"
# zamiast "osyp (pszczół)" jest [martwe pszczoły,martwych pszczół]
# colonyForce: było "norma" jest "normalna"
# colonyState: było "zła" jest "agresywna",
# colonyState: było "w kłębie" jest "zawiązała kłąb"
# "zbiór pyłek" zamieniłem na "zbiór pyłku" w trzech wariantach z poprawionymi miarami
# przy zbiorach miodu nie wiem czy zostawić "miód o branie", dodałem na sztywno dwie formy [mała ramka, małych ramek] i analogicznie dla dużych
# setFrames: było "ramka" jest "ramkę" i dodałem alternatywę "ramki"
# setChange: było "(prze) (g) (lądzie)" jest "przeglądzie"
# w  helpMe: było "zbiór" jest "zbiory", było "pokarm" jest "dokarmianie"
# setMoveBody: (chyba poprawniej powinno się to nazywać setMoveFrame:) było "przenieś" teraz dopuszczam również "przenieś do" - precyzyjniej określa do działanie, poza tym dopuszczalna jest forma "ula" i "korpusu"

# Zmiany 01.08.2026 (Claude) - po teście offline na nagraniach "nakrop" z pliki/*.wav
# oraz sprawdzeniu CAŁEJ gramatyki wobec słownika modelu vosk-model-small-pl-0.22.
# Narzędzie do powtórzenia testów: pliki/vosk_gramatyka_test.py
#
# SKŁADNIA: wyrażenia zaczynające się od "[" MUSZĄ być w cudzysłowie - inaczej YAML
#   czyta je jako listę i plik nie parsuje się w ogóle (tak było w oryginale pol1 (4).yml).
#   Zacytowane: setStore x5, setQueen x5, setColony, setHarvest x2.
# "na kro (p)" -> "na grób". Model na 17 wypowiedziach "nakrop X procent" słyszy
#   "na grób" (13x) albo "na krok" (3x). Wynik z gramatyką: "na grób" 17/17 przy
#   pewności 1,00; "na kro p" łapie się w dwóch różnych formach przy 0,58-1,00
#   (końcówka "p" wypada w połowie przypadków - Twoja obserwacja się potwierdziła).
#   NIE dokładać "na krok" obok "na grób" - konkurują ze sobą i pewność spada do 0,54.
# "trut" USUNIĘTY - jedyne słowo gramatyki spoza słownika modelu (Vosk pomija je po
#   cichu). Zostaje samo "trud": przez ubezdźwięcznienie wygłosowe wymawia się
#   dokładnie [trut], czyli jest homofonem - nic nie tracimy.
# paski: $state przesunięty PRZED "paski" (był wymagany w środku, więc "paski pięć
#   sztuk" z listy komend nie miałoby prawa zadziałać) -> "wstaw paski pięć sztuk".
# kwas: dołożone "miligramów" (jest w słowniku jako jedno słowo) i rozbicia
#   "mili litr/litry/litra" (samego "mililitr"/"mililitry" w słowniku NIE MA).
#   UWAGA: apka i tak zapisuje jednostkę "ml" na sztywno (voice_screen2 case 'acid'),
#   formy z "gram" są tylko dopuszczeniem tego, jak człowiek może powiedzieć.
# "miód o branie" -> "miodu branie": "miód" ubezdźwięcznia się do [mjut], więc stary
#   wariant brzmiał [mjut o braɲe] wobec wypowiadanego [mjodobraɲe]. "miodobranie"
#   jako jedno słowo w słowniku NIE występuje. Wariant do sprawdzenia na nagraniu.
# "okej" dopisane obok "ok" (quality, queenQuality, colonyState) - jest w słowniku,
#   a "ok" model może traktować jako nazwy liter.
# date: dopisana forma "aktualna" obok "aktualną" (obie są w słowniku).
# usunięte zbłąkane spacje po przecinkach w alternatywach ([... , x] dawało token " x").
#
# POTWIERDZONE NAGRANIEM 01.08.2026: "węża" (zamiast węza) i "pierzcha" (zamiast
# pierzga) DZIAŁAJĄ - zostają w gramatyce, zapas "wosk"/"pyłek" niepotrzebny.
#   Nagranie: pliki/vosk_0801-124040_domyslne_surowy_16k_bufdom_1x_gram_STRUM.wav
#   (60 s, 8x "węza X procent [z lewej / z obu stron]", 6x "pierzga X procent ...").
#   Z gramatyką: 8/8 "węża" i 6/6 "pierzcha", pewność 1,00 (raz 0,87) - 14/14 trafień,
#   liczebniki i strony też poprawne. Tryb wolny pokazuje, dlaczego alias jest
#   konieczny: "węza" -> "węzeł"/"węża"/"za", "pierzga" -> "pies go", "pijesz go",
#   "bierz go", "pięć gra", "pierwsze". Czyli kontrast z/ż i g/ch model gubi tak samo
#   jak przy "nakrop" - alias ze słownika wygrywa z poprawną pisownią spoza słownika.
#
# Zmiany 01.08.2026 (Claude) - po zbudowaniu silnika-parsera i przejechaniu
# przykładowych komend z pliki/lista_komend.txt (100 wypowiedzi):
# - setEquipment: "podłoga jest $quality" -> "podłoga (jest) $quality", bo
#   "podłoga wyczyszczona" (bez "jest") to naturalna forma i była odrzucana.
# - setHarvest przy miodzie: "(razy)" -> "(raz,razy)" - "zbiór miodu jeden RAZ
#   duża ramka" nie miało prawa zadziałać. Przy pyłku "(raz,razy)" już było.
# - setHive/setBody: $state ZOSTAJE wymagany (decyzja usera - komendy typu
#   "ul numer 16" bez czasownika nie istnieją; wykreślone z lista_komend.txt).
# - setTreatment "paski": $state ZOSTAJE wymagany (decyzja usera); to przykład
#   w lista_komend.txt był niepełny, poprawiony na "wstaw paski pięć sztuk".
#
# PRZYIMEK "z" GINIE — Vosk go NIE zwraca, choć jest i w słowniku, i w gramatyce.
#   Wychodzi "pięćdziesiąt procent lewej" i "sto procent obu stron" - 14/14 razy, bez
#   wyjątku. Powód: jedna niezgłoskotwórcza spółgłoska, nieakcentowana, zlewa się z
#   następnym słowem ([zlevej] -> jedno słowo fonetyczne).
#
# SŁOWO "PROCENT" GINIE (zgłoszone z urządzenia 02.08.2026) — ta sama fonetyka
#   co przy "z": nieakcentowane, stoi między liczebnikiem a "z prawej", a jego
#   nagłosowe [p] wtapia się w wygłos liczebnika ("dziesięć procent" -> [dziesiećprocent],
#   przy szybkiej mowie [dziesięć_rocent] albo nic). Efekt: cała komenda nie
#   dopasowywała się do wzorca, bo $pv.Percent WYMAGAŁ tego słowa.
#
#   TEJ ZMIANY NIE DA SIĘ ZROBIĆ W TYM PLIKU: "procent" nie jest słowem wyrażenia,
#   tylko częścią typu wbudowanego $pv.Percent (kontrakt odziedziczony po Rhino).
#   Zapis "(procent)" w wyrażeniach byłby martwy - parser i tak szukałby go sam.
#   Zrobione więc tam, gdzie to słowo żyje - w vosk_grammar.dart (+ referencja
#   vosk_parser_ref.py), dokładnie jak dla przyimków z pomijalneSlowa:
#     - brak "procent" -> slot i tak dostaje "NN%", z karą 1 (wypowiedź ZE słowem
#       nadal wygrywa, więc nic się nie przestawia w rozstrzyganiu remisów);
#     - w tej pozycji żadne wyrażenie nie oczekuje innego słowa, więc liczba
#       pozostaje jednoznaczna: "larwy dziesięć z prawej" == "larwy dziesięć
#       procent z prawej".
#   Kontrola: 98 komend z lista_komend.txt daje ten sam wynik przed i po (83 OK,
#   0 złych intentów) - tolerancja niczego nie przechwyciła po drodze.
#
#   DRUGA POŁOWA NAPRAWY — MOSTKI W GRAMATYCE RECOGNIZERA (vosk_grammar.dart,
#   frazy()). Wyrażenia są rozcinane na typach wbudowanych, więc "procent"
#   trafiało do Vosk WYŁĄCZNIE jako samotna, jednowyrazowa fraza - model języka
#   nie miał ani bigramu "dziesięć procent", ani "procent z prawej", czyli
#   pominięcie tego słowa nie kosztowało go prawie nic. Dołożone: kawałek po
#   $pv.Percent zaczyna się od słowa "procent" oraz pary "<liczebnik> procent".
#   Zmierzone na pliki/vosk_0801-124040_...wav (14 wypowiedzi): tekst bez zmian,
#   pewność słowa "procent" 0,91 -> 1,00, gramatyka 3079 -> 3174 fraz (+3 %).
#
# POPRAWKI NANIESIONE 01.08.2026 (wyrażenia - przyimek jest tam zwykłym wypełnieniem):
#   - "[z,po]" -> "(z,po)" w 13 wyrażeniach setStore. To był TWARDY BLOKER: nawias
#     kwadratowy = alternatywa WYMAGANA, więc skoro "z" nie wraca z Vosk, żadna z 13
#     najczęściej używanych komend (pokarm/miód/czerw/susz/matecznik/węża/pierzcha...)
#     nie dopasowałaby się do wzorca. "po" zostawione w alternatywie - ma sylabę z
#     samogłoską, więc wraca normalnie; opcjonalność obsługuje oba przypadki.
#   - "ramek w korpusie" -> "ramek (w) korpusie" (setEquipment). "w" jest jeszcze
#     słabsze od "z" (w wygłosie ubezdźwięcznia się do [f] i wtapia w następne słowo).
#   - "[jest z roku,rocznik]" -> "[jest z roku,jest roku,rocznik]" (setQueen) - wariant
#     bez "z" dla tej samej przyczyny.
#
# CELOWO NIE ZMIENIONE — SLOTY: "w klatce" (queenStart), "w nastroju do ucieczki"
#   (colonyState), "przesuń w prawo"/"przesuń w lewo" (isDone). Wartość slotu jest
#   PORÓWNYWANA JAKO DOKŁADNY STRING w voice_screen2.dart (m.in. case 'przesuń w
#   prawo' w linii ~10300, 'przesuń w lewo' ~10320, warunki ~965/~998/~4616/~4641).
#   Wycięcie/uopcjonalnienie "w" w wartości slotu urwałoby te komendy w apce.
#   ZADANIE DLA PARSERA: dopasowując slot, traktuj jednoliterowe przyimki (z, w) jako
#   OPCJONALNE w tekście z Vosk, ale zwracaj ZAWSZE kanoniczną wartość z tego pliku.
#   Czyli tekst "przesuń prawo" musi dać slot isDone = "przesuń w prawo".
#
# AUDYT 04.08.2026 — WARTOŚCI SLOTÓW KONTRA app_pl.arb
