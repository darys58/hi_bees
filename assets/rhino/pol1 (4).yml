context:
  expressions:
    setApiary:
      - $state:apiaryState pasieka (numer) $pv.TwoDigitInteger:nrXXOfApiary
    setHive:
      - $state:hiveState ul (numer) ($hundred:nrXXOfHiveH)
        ($pv.TwoDigitInteger:nrXXOfHive)
    setBody:
      - $state:bodyState korpus (numer) $pv.SingleDigitInteger:nrXOfBody
    setFrame:
      - ($state:frameState)($sizeOfFrame:sizeOfFrame) ramka (numer)
        $pv.TwoDigitInteger:nrXXOfFrame (z) ($siteOfFrame:siteOfFrame)(strony,
        stron)
    setStore:
      - pokarm $pv.Percent:food [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - larwa $pv.Percent:larvae [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - (miód) dojrzały $pv.Percent:honeySealed [z,po]
        ($siteOfFrame:siteOfFrame) (strony,stronie)
      - "[jaja,jajka] $pv.Percent:eggs [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)"
      - (ustaw) (z) $siteOfFrame:siteOfFrame [strona,stronę,strony]
      - $isDone:isDone
      - $toDo:toDo
      - (czerw) trut $pv.Percent:drone [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - "[usuń,wytnij] $pv.SingleDigitInteger:delQCells matecznik [z,po]
        ($siteOfFrame:siteOfFrame) (strony,stronie)"
      - $queen:queen [matka,królowa] [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - $pv.SingleDigitInteger:queenCells matecznik [z,po]
        ($siteOfFrame:siteOfFrame) (strony,stronie)
      - susz $pv.Percent:waxComb [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - węza $pv.Percent:wax [z,po] ($siteOfFrame:siteOfFrame) (strony,stronie)
      - (czerw) kryty $pv.Percent:brood [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - pierzga $pv.Percent:pollen [z,po] ($siteOfFrame:siteOfFrame)
        (strony,stronie)
      - miód $pv.Percent:honey [z,po] ($siteOfFrame:siteOfFrame) (strony,stronie)
    setHalfBody:
      - $state:halfBodyState pół korpus (numer)
        $pv.SingleDigitInteger:nrXOfHalfBody
    setAllHives:
      - $state:allHivesState wszystkie ule
    setFeeding:
      - zostało $pv.Percent:leftFood pokarm
      - usuń $pv.Percent:removedFood pokarm
      - syrop $pv.TwoDigitInteger:invertI (przecinek,kropka)
        ($pv.TwoDigitInteger:invertD) litr
      - ciasto $pv.SingleDigitInteger:candyI (przecinek,kropka)
        ($pv.TwoDigitInteger:candyD) [kilo, kilogram]
      - syrop trzy do dwóch $pv.SingleDigitInteger:syrup3to2I (przecinek,kropka)
        ($pv.TwoDigitInteger:syrup3to2D) litr
      - syrop jeden do [jeden,jednego] $pv.SingleDigitInteger:syrup1to1I
        (przecinek,kropka) ($pv.TwoDigitInteger:syrup1to1D) litr
    setTreatment:
      - kwas ($hundred:acidH) ($pv.TwoDigitInteger:acid) mililitr
      - roztocza ($hundred:varroaH) ($pv.TwoDigitInteger:varroa) sztuki
      - o war $state:biovar $pv.SingleDigitInteger:biovarBelts [pasek,paski]
      - chemia [porcja,dawka] numer $pv.SingleDigitInteger:apivarol
    setEquipment:
      - $deleted:excluderDel kratę
      - krata (na) korpus (numer) $pv.SingleDigitInteger:excluder
      - podłoga jest $quality:bottomBoard
      - $state:beePolenTrap zbieracz pyłek
      - (ustaw) ilość ramka na korpus (jest) $pv.TwoDigitInteger:numberOfFrame
    setQueen:
      - "[królowa,matka] jest $queenQuality:queenQuality"
      - "[królowa,królowej,matka,matki] $queenMark:queenMark (numer)
        ($pv.TwoDigitInteger:queenNumber)"
      - "[królowa,matka] jest $queenStart:queenStart"
      - "[królowa,matka] jest $queenState:queenState"
      - "[królowa,matka] jest z roku $pv.TwoDigitInteger:queenBorn"
    setHelp:
      - $help:help
      - $helpMe:helpMe pomóż mi
    setDate:
      - ustaw inny dzień $pv.TwoDigitInteger:dateDay
      - ustaw inny miesiąc $pv.TwoDigitInteger:dateMonth
      - ustaw inny rok $pv.TwoDigitInteger:dateYear
      - ustaw $date:currentDate data
    setColony:
      - osyp (pszczół) ($hundred:deadBeeHML) ($pv.TwoDigitInteger:deadBeeML)
        (mililitr)
      - rodzina (jest) $colonyForce:colonyForce
      - rodzina (jest) $colonyState:colonyState
    setHarvest:
      - zbiór pyłek ($hundred:beePollenHarvestHML)
        ($pv.TwoDigitInteger:beePollenHarvestML) (mililitr)
      - zbiór pyłek $pv.SingleDigitInteger:beePollenHarvestI (przecinek,kropka)
        ($pv.TwoDigitInteger:beePlllenHarvestD) litr
      - zbiór pyłek $pv.TwoDigitInteger:beePollenHarvest (razy)[miarka, porcja]
      - "[zbiór miodu, miód o branie] $pv.TwoDigitInteger:honeySmallHarvest
        (razy)[mała, małych] ramka"
      - "[zbiór miodu, miód o branie] $pv.TwoDigitInteger:honeyBigHarvest (razy)
        [duża, dużych] ramka"
    setFrames:
      - ($state:framesState) ramka od $pv.TwoDigitInteger:nrXXOdFrame do
        $pv.TwoDigitInteger:nrXXDoFrame
    setChange:
      - ramka (numer) $pv.TwoDigitInteger:nrXXOfFrame po (prze) (g) (lądzie)
        (numer) $pv.TwoDigitInteger:nrXXOfFramePo
    setMoveBody:
      - przenieś (ul) (numer) ($pv.TwoDigitInteger:nrTempHive) pół korpus
        (numer) $pv.SingleDigitInteger:nrTempHalfBody ramka (numer)
        $pv.TwoDigitInteger:nrTempFrame
      - przenieś (ul) (numer) ($pv.TwoDigitInteger:nrTempHive) korpus (numer)
        $pv.SingleDigitInteger:nrTempBody ramka (numer)
        $pv.TwoDigitInteger:nrTempFrame
  slots:
    state:
      - wstaw
      - załóż
      - zabierz
      - usuń
      - załącz
      - wyłącz
      - otwórz
      - zamknij
      - ustaw
    siteOfFrame:
      - obu
      - prawej
      - lewej
      - prawa
      - lewa
      - prawą
      - lewą
      - obie
    toDo:
      - można izolować
      - trzeba usunąć
      - trzeba wirować
      - ramka pracy
    isDone:
      - izolacja
      - wstaw ramka
      - usuń ramka
      - przesuń w prawo
      - przesuń w lewo
    sizeOfFrame:
      - mała
      - duża
      - małą
      - dużą
    queen:
      - biała
      - niebieska
      - zielona
      - czerwona
      - żółta
      - czarna
    quality:
      - ok
      - brudna
      - czysta
    queenState:
      - dziewica
      - sztuczna
      - naturalna
    queenStart:
      - wolna
      - zamknięta
      - w klatce
    queenMark:
      - ma niebieski znak
      - ma zielony znak
      - ma czerwony znak
      - ma żółty znak
      - ma biały znak
      - brak
      - nie ma
      - nie ma znak
    queenQuality:
      - stara
      - ok
      - zła
      - duża
      - mała
      - słaba
      - bardzo dobra
      - dobra
    helpMe:
      - ul po
      - ul przed
      - lokacja
      - ul wcześniej
      - ul później
      - ul
      - zbiór
      - rodzina
      - data
      - leczenie
      - pokarm
      - matka
      - wyposażenie
      - przegląd
    date:
      - prawdziwą
    colonyForce:
      - norma
      - bardzo słaba
      - słaba
      - bardzo silna
      - silna
    colonyState:
      - w nastroju do ucieczki
      - ok
      - w kłębie
      - zła
      - łagodna
      - nie żyje
    help:
      - zamknij pomoc
      - pomóż mi
    hundred:
      - dziewięćset
      - osiemset
      - siedemset
      - sześćset
      - pięćset
      - czterysta
      - trzysta
      - dwieście
      - sto
    deleted:
      - zabierz
      - usuń
  macros: {}
