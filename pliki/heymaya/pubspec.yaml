name: heymaya
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.12.1+96

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Runtime dependencies
  path_provider: ^2.0.9
  sqflite: ^2.4.2
  intl: ^0.20.2
  provider: ^6.0.5
  # flutter_beep: ^1.0.0
  # ZOSTAJE WYŁĄCZONY. Pakiet stoi na AGP sprzed 8.0 i nie deklaruje `namespace`
  # w swoim android/build.gradle, więc od AGP 8 build Androida zatrzymuje się na
  # "Namespace not specified". Beep potwierdzenia komendy gra teraz przez
  # SoundHelper.beep() (assets/audio/listening.wav) - patrz voice_vosk_screen.
  wakelock_plus: ^1.1.6
  http: ^1.5.0
  device_info_plus: ^12.1.0
  connectivity_plus: ^7.0.0
  # in_app_purchase: ^3.1.5
  shared_preferences: ^2.1.0
  flutter_slidable: ^4.0.1 
  url_launcher: ^6.1.10
  fl_chart: ^1.1.1
  # Sterowanie głosowe: Vosk (offline STT). Picovoice (picovoice_flutter,
  # porcupine, rhino) usunięte 03.08.2026 - zastąpione w całości przez Vosk.
  # KOPIA W REPO (nie pub.dev, nie vosk_flutter_2): oryginał dekodował na
  # wątku UI - na Androidzie budowa recognizera z ~3,3 tys. fraz wieszała ekran
  # ("aplikacja nie odpowiada"), a acceptWaveForm szło 5x/s po tym samym wątku,
  # na którym rysuje się żywy podgląd korpusu. Kolejka szeregowa + reguły R8 dla
  # JNA są w packages/vosk_flutter_service (opis w HI_BEES_PATCH.md).
  # Binaria iOS (vosk.xcframework) NIE są w tej kopii - dociąga je:
  #   dart run vosk_flutter_service install -t ios
  # Android bierze vosk-android i JNA z Mavena, więc nie potrzebuje niczego.
  vosk_flutter_service:
    path: packages/vosk_flutter_service
  record: ^6.2.1 #własny strumień PCM 16 kHz do Vosk (obejście wadliwego SpeechService)
  audioplayers: ^6.1.0 #odzywki Mai (SoundHelper) i odsłuch nagranych notatek
  nfc_manager: ^3.5.0
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  table_calendar: ^3.1.3


dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # flutter_native_splash: ^2.4.6


# flutter_native_splash:
#   image: "assets/image/hi_bees_1024.png"
#   color: "#E8AE31"
