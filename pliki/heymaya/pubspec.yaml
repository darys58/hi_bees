    # odzywki Mai (SoundHelper) - nagrane mp3 zamiast sygnałów systemowych
    - assets/audio/slucham.mp3
    - assets/audio/czekam.mp3
    - assets/audio/czekam_na_polecenia.mp3
    - assets/audio/zapisalam.mp3
    - assets/audio/okej.mp3
    - assets/audio/zamkniete.mp3
    - assets/audio/blad.mp3
    - assets/audio/nie_rozumiem.mp3
    # krótki (0,15 s) sygnał potwierdzenia komendy - NIE JEST MOWĄ, więc gdy
    # przecieknie do mikrofonu, Vosk nie ma z czego zbudować słowa.
    # UWAGA: to WYJŚCIE AWARYJNE. Normalnie sygnał gra dźwiękiem systemowym
    # (kanał hej_maja/sygnal), plik idzie w ruch dopiero, gdy system odmówi.
    - assets/audio/listening.wav
    # Własny sygnał zamiast wbudowanego: wrzuć plik pod tę nazwę i odkomentuj
    # linię - SoundHelper bierze go automatycznie (patrz _plikSygnaluWlasny).
    # Bez pliku linia MUSI zostać zakomentowana, inaczej build się wywali.
   # - assets/audio/beep.mp3
   # - assets/audio/sound7.mp3
  
  
  uses-material-design: true
  generate: true

  # The following line ensures that the Material Icons font is
