   # - assets/porcupine/porcupine_params_en_US.pv
   # - assets/rhino/rhino_params_pl_PL.pv
   # - assets/rhino/rhino_params_en_US.pv
    # gramatyka dla silnika-parsera Vosk (lib/helpers/vosk_grammar.dart)
    - assets/grammar/pol_vosk.yml
    - assets/image/matka1.png
    - assets/image/matka11.png
    - assets/image/matka12.png
